name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: ESLint
        run: npm run lint:js

  test:
    name: PHPUnit
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Create wp-tests-config.php
        run: cp wp-tests-config.php.example wp-tests-config.php

      - name: Run PHPUnit
        run: vendor/bin/phpunit --log-junit test-results/phpunit.xml --testdox-text test-results/testdox.txt --coverage-text=test-results/coverage.txt --coverage-clover test-results/coverage.xml
        env:
          WP_TESTS_DB_HOST: 127.0.0.1:3306
          WP_TESTS_DB_NAME: wordpress_test
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/phpunit.xml

      - name: Build PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo "## Tests"
            cat test-results/testdox.txt
            echo ""
            echo "## Coverage"
            cat test-results/coverage.txt
          } > test-results/comment.md

      - name: Post comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          header: phpunit-report
          path: test-results/comment.md
